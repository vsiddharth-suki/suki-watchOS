name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild \
            -project suki-watch.xcodeproj \
            -scheme "suki-watch Watch App" \
            -destination 'generic/platform=watchOS Simulator' \
            build
